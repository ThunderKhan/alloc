name: Alloc checks
on:
  push:
    branches: ['feat/paid-inference-mvp-20261107', main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve exact dependencies and generate lockfile when missing
        run: npm install --package-lock-only --ignore-scripts
      - name: Install reproducibly from resolved lock
        run: npm ci
      - name: Commit lockfile on implementation branch after successful install
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/paid-inference-mvp-20261107'
        run: |
          if ! git diff --quiet -- package-lock.json || ! git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "build: commit reproducible npm dependency lock"
            git push origin HEAD:feat/paid-inference-mvp-20261107
          fi
      - name: Report production dependency advisories
        run: |
          npm audit --omit=dev --json > npm-audit.json || true
          node -e 'const a=require("./npm-audit.json"); for(const [name,v] of Object.entries(a.vulnerabilities || {})) console.log(JSON.stringify({name,severity:v.severity,range:v.range,via:v.via,fixAvailable:v.fixAvailable}));'
      - name: TypeScript
        run: npm run typecheck
      - name: Payment and persistence tests
        run: npm test
      - name: Next.js production build
        run: npm run build
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pytest httpx
      - run: python -m pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r worker/requirements.txt
      - name: Worker isolation/validation checks
        env:
          PYTHONPATH: worker
        run: python -m pytest worker/test_app.py -q -m 'not live_model'
      - name: Real PyTorch CPU inference smoke
        env:
          PYTHONPATH: worker
          ALLOC_REAL_MODEL_TEST: '1'
        run: python -m pytest worker/test_app.py -q -m live_model
