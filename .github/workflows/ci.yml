name: Alloc checks
on:
  push:
    branches: ['feat/paid-inference-mvp-20261107', main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install directly from committed lockfile
        run: npm ci
      - name: Verify committed lockfile remains unchanged
        run: git diff --exit-code -- package-lock.json
      - name: Report production dependency advisories
        run: |
          npm audit --omit=dev --json > npm-audit.json || true
          node -e 'const a=require("./npm-audit.json"); for(const [name,v] of Object.entries(a.vulnerabilities || {})) console.log(JSON.stringify({name,severity:v.severity,range:v.range,via:v.via,fixAvailable:v.fixAvailable}));'
      - name: Report dev-only advisories separately
        run: |
          npm audit --json > npm-audit-all.json || true
          node -e 'const a=require("./npm-audit-all.json"); for(const [name,v] of Object.entries(a.vulnerabilities || {})) console.log(JSON.stringify({name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable,via:v.via}));'
      - name: TypeScript
        run: npm run typecheck
      - name: Payment and persistence tests
        run: npm test
      - name: Next.js production build
        run: npm run build
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pytest httpx
      - run: python -m pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r worker/requirements.txt
      - name: Worker isolation/validation checks
        env:
          PYTHONPATH: worker
        run: python -m pytest worker/test_app.py -q -m 'not live_model'
      - name: Real PyTorch CPU inference smoke
        env:
          PYTHONPATH: worker
          ALLOC_REAL_MODEL_TEST: '1'
        run: python -m pytest worker/test_app.py -q -m live_model
      - name: Record downloaded upstream model checkpoint SHA-256
        run: sha256sum "$HOME/.cache/torch/hub/checkpoints/mobilenet_v3_small-047dcff4.pth"

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install directly from committed lockfile
        run: npm ci
      - name: Assert lockfile is unchanged
        run: git diff --exit-code -- package-lock.json
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Browser state and responsive tests (fixtures only)
        run: npm run test:browser
