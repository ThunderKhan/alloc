name: Real Devnet paid-inference smoke (ephemeral software wallet)
on:
  push:
    branches: ['feat/paid-inference-mvp-20261107']
    paths:
      - '.github/workflows/live-devnet.yml'
      - 'scripts/live-devnet-smoke.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-devnet:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: python -m pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r worker/requirements.txt
      - run: npm run build
      - name: Real funded Devnet split, independent verification and private CPU inference
        env:
          ALLOC_LIVE_DEVNET: '1'
        run: node scripts/live-devnet-smoke.mjs
